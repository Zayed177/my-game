        function update(dt){
            if(dying){updateShards(dt);deathTimer-=dt;if(deathTimer<=0)finishGameOver();return;}
            if(gameWon){updateShards(dt);bossKillMessage.timer-=dt;if(bossKillMessage.timer<=0)finishVictory();return;}

            if(bossEntranceActive){
                bossEntranceTimer-=dt;
                if(bossEntranceTimer<=0){
                    bossEntranceActive=false;
                }
            }

            if(chapterState.active){
                chapterState.timer-=dt;
                if(chapterState.timer<=0){
                    chapterState.active=false;
                    cineTop.classList.remove('active');cineBot.classList.remove('active');chapterOverlay.classList.remove('active');
                }
            }

            for(const ss of shootingStars){
                ss.life+=dt;
                if(ss.life>ss.phase+0.8){
                    ss.life=0;
                    ss.phase=15+Math.random()*25;
                    ss.x=Math.random()*WORLD_W;
                    ss.y=Math.random()*WORLD_H*0.5;
                }
            }

            elapsed+=dt;timeVal.textContent=elapsed.toFixed(1);keyboardInput();
            if(gameMode===1){
                pointsTimer+=dt;if(pointsTimer>=POINTS_INTERVAL){pointsTimer-=POINTS_INTERVAL;points+=POINTS_AWARD;updatePointsHUD();}
                if(bossWarningTimer>0)bossWarningTimer-=dt;
                if(elapsed-lastBossSpawnTime>=40&&!gameWon&&bosses.length===0){
                    spawnBoss();
                    lastBossSpawnTime=elapsed;
                    MusicEngine.play('boss');
                }
            }

            if(bossKillMessage.timer>0)bossKillMessage.timer-=dt;
            if(coinPopup){coinPopup.timer-=dt;coinPopup.y-=dt*16;if(coinPopup.timer<=0)coinPopup=null;}
            if(bigShotFlash.timer>0)bigShotFlash.timer-=dt;

            for(let i=ghostTrails.length-1;i>=0;i--){ghostTrails[i].life-=dt*3.2;if(ghostTrails[i].life<=0)ghostTrails.splice(i,1);}

            for(const o of obstacles){
                if(o.hp<=0)continue;
                const cx=player.x,cy=player.y,r=player.r;
                const nx=Math.max(o.x,Math.min(o.x+o.w,cx));
                const ny=Math.max(o.y,Math.min(o.y+o.h,cy));
                const d=Math.hypot(cx-nx,cy-ny);
                if(d<r){const a=Math.atan2(cy-ny,cx-nx);const ov=r-d;player.x+=Math.cos(a)*ov;player.y+=Math.sin(a)*ov;player.vx=Math.cos(a)*35;player.vy=Math.sin(a)*35;}
                if(gameMode===2&&player2){
                    const cx2=player2.x,cy2=player2.y,r2=player2.r;
                    const nx2=Math.max(o.x,Math.min(o.x+o.w,cx2));
                    const ny2=Math.max(o.y,Math.min(o.y+o.h,cy2));
                    const d2=Math.hypot(cx2-nx2,cy2-ny2);
                    if(d2<r2){const a=Math.atan2(cy2-ny2,cx2-nx2);const ov=r2-d2;player2.x+=Math.cos(a)*ov;player2.y+=Math.sin(a)*ov;player2.vx=Math.cos(a)*35;player2.vy=Math.sin(a)*35;}
                }
            }

            for(let i=explosions.length-1;i>=0;i--){const e=explosions[i];e.r+=dt*450;e.alpha-=dt*2.0;if(e.alpha<=0)explosions.splice(i,1);}
            for(let i=shockwaves.length-1;i>=0;i--){const sw=shockwaves[i];sw.r+=dt*400;if(sw.r>=sw.maxR){shockwaves.splice(i,1);continue;}if(sw.hostile&&Math.hypot(player.x-sw.x,player.y-sw.y)<sw.r){if(buffs.shieldOn){buffs.shieldOn=false;buffs.shieldT=0;updateBuffsHUD();SoundEngine.sfx('shield');}else{triggerDeath();return;}}}

            if(transformTier>0&&transformTimer>0){
                transformTimer-=dt;
                if(transformTimer<=0){
                    if(transformTier===4){transformTier=3;transformTimer=TIER_DURATIONS[3];}
                    else if(transformTier===3){transformTier=2;transformTimer=TIER_DURATIONS[2];}
                    else if(transformTier===2){transformTier=1;transformTimer=TIER_DURATIONS[1];}
                    else {transformTier=0;transformTimer=0;}
                    maxCharge=100+transformTier*22+levelStats.maxChargeBonus;
                }
                updateFormBadge();
            }
            if(p2TransformTier>0&&p2TransformTimer>0){
                p2TransformTimer-=dt;
                if(p2TransformTimer<=0){
                    if(p2TransformTier===4){p2TransformTier=3;p2TransformTimer=TIER_DURATIONS[3];}
                    else if(p2TransformTier===3){p2TransformTier=2;p2TransformTimer=TIER_DURATIONS[2];}
                    else if(p2TransformTier===2){p2TransformTier=1;p2TransformTimer=TIER_DURATIONS[1];}
                    else {p2TransformTier=0;p2TransformTimer=0;}
                    p2MaxCharge=100+p2TransformTier*22;
                }
            }

            updateFriends(dt);
            if(buffs.speedT>0)buffs.speedT=Math.max(0,buffs.speedT-dt);
            if(buffs.slowT>0)buffs.slowT=Math.max(0,buffs.slowT-dt);
            if(buffs.shieldOn&&buffs.shieldT>0){buffs.shieldT-=dt;if(buffs.shieldT<=0)buffs.shieldOn=false;}
            updateBuffsHUD();

            // NOTE: on an online client, `player` represents the REMOTE (host's) ship.
            // Its position/effects are driven entirely by the network snapshots
            // (applyNetworkState / netInterpolateStep). Running the local simulation
            // below on the client too used to make the client's own key presses
            // (meant to steer player2, its own ship) also charge/boost/fire the
            // remote ship locally -> duplicate bullets, stray ghost trails, and
            // charge-halo flicker on the host's ship as seen by the joining player.
            // So this whole block is host / single-player / local-hotseat only.
            if(onlineMode!=='client'){
            const isCharging=keys[keybinds.p1.charge]||isMobileCharging;
            const isBoosting=(keys[keybinds.p1.boost]||isMobileBoosting)&&playerCharge>0;
            if(fireCooldown>0)fireCooldown-=dt;
            if(timeFreezeTimer>0)timeFreezeTimer-=dt;

            const tierB=(1+transformTier*.09)*(levelStats.chargeRateBonus);
            const chargeRate=50*tierB;
            if(isCharging){playerCharge=Math.min(maxCharge,playerCharge+chargeRate*dt);updateChargeBarHUD();}
            if(isBoosting){
                playerCharge=Math.max(0,playerCharge-14*dt);updateChargeBarHUD();
                if(Math.random()<0.55)ghostTrails.push({x:player.x,y:player.y,r:player.r,angle:player.angle,life:1.0,stretch:1+Math.min(1,Math.hypot(player.vx,player.vy)/420)*.35,tier:transformTier,isP2:false});
            }
            wasBoosting=isBoosting;

            const dmgB=levelStats.damageBonus;
            const fireCD=.1/tierB;
            if((keys[keybinds.p1.shoot]||isMobileShooting)&&!isMobileCharging&&!keys[keybinds.p1.charge]&&fireCooldown<=0&&(gameMode===2?playerCharge>=maxCharge*0.01:playerCharge>=1)){
                fireCooldown=fireCD;
                if(gameMode===1)playerCharge=Math.max(0,playerCharge-1);
                else playerCharge=Math.max(0,playerCharge-maxCharge*0.01);
                const sz=(3+transformTier*.8)*tierB;
                const baseDmg=Math.round((1+transformTier*.07)*dmgB);
                const p1Targets=gameMode===2?(player2?[player2]:[]):enemies.concat(bosses);
                const p1AimAngle=isPhone?applyAimAssist(player.x,player.y,player.angle,p1Targets,340,0.26,0.22):player.angle;
                bullets.push({x:player.x+Math.cos(p1AimAngle)*player.r,y:player.y+Math.sin(p1AimAngle)*player.r,vx:Math.cos(p1AimAngle)*760,vy:Math.sin(p1AimAngle)*760,r:sz,damage:Math.max(1,baseDmg),life:1.3,color:TIER_COLORS[transformTier],owner:'p1',_netNew:(gameMode===2)});
                SoundEngine.sfx('collect');updateChargeBarHUD();
            }

            let spdMul=1;if(buffs.speedT>0)spdMul*=1.5;if(isBoosting)spdMul*=1.6;if(isCharging)spdMul*=.4;
            const statMul=(levelStats.speedBonus)*tierB;
            const speed=PLAYER_SPEED*spdMul*statMul;
            // Frame-rate independent movement with sub-stepping for smoothness
            const moveSteps=Math.max(1,Math.floor(dt/0.008));
            const stepDt=dt/moveSteps;
            for(let ms=0;ms<moveSteps;ms++){
                player.vx=input.x*speed;player.vy=input.y*speed;
                player.x+=player.vx*stepDt;player.y+=player.vy*stepDt;
            }
            player.x=Math.max(player.r,Math.min(WORLD_W-player.r,player.x));
            player.y=Math.max(player.r,Math.min(WORLD_H-player.r,player.y));
            updateCamera();

            if(isBoosting){for(let i=0;i<2;i++){particles.push({x:player.x-Math.cos(player.angle)*player.r*1.2+(Math.random()-.5)*6,y:player.y-Math.sin(player.angle)*player.r*1.2+(Math.random()-.5)*6,life:.2,r:2.5,color:'#ffe14b'});}if(Math.random()<.15)shockwaves.push({x:player.x,y:player.y,r:0,maxR:22,color:'rgba(255,225,75,.4)',hostile:false});}
            if(input.x||input.y){
                // Only update angle from movement if not using mouse aim on PC
                if(platform!=='pc'||!settings.mouseControl||!mouseInCanvas)player.angle=Math.atan2(input.y,input.x);
                if(Math.random()<.35)particles.push({x:player.x,y:player.y,life:.25,r:2+Math.random()*2,color:isBoosting?'#ffe14b':TIER_COLORS[transformTier]});
            }
            } else {
                // Client side: `player` (the remote host ship) has no local simulation here
                // (its position/angle come from netInterpolateStep). But we still want to see
                // the host's boost afterimage/particles when they're boosting, driven by the
                // `remotePlayerBoost` flag which netInterpolateStep sets from the synced pboost flag.
                if(remotePlayerBoost.timer>0){
                    remotePlayerBoost.timer-=dt;
                    if(Math.random()<0.55)ghostTrails.push({x:player.x,y:player.y,r:player.r,angle:player.angle,life:1.0,stretch:1+Math.min(1,Math.hypot(player.vx,player.vy)/420)*.35,tier:transformTier,isP2:false});
                    for(let i=0;i<2;i++){particles.push({x:player.x-Math.cos(player.angle)*player.r*1.2+(Math.random()-.5)*6,y:player.y-Math.sin(player.angle)*player.r*1.2+(Math.random()-.5)*6,life:.2,r:2.5,color:'#ffe14b'});}
                }
            } // end onlineMode!=='client' guard

            if(gameMode===2&&player2){
                if(player2.fireCooldown>0)player2.fireCooldown-=dt;
                const p2Charging=onlineMode==='client'?keys[keybinds.p1.charge]||isMobileCharging:keys[keybinds.p2.charge];
                const p2Boost=(onlineMode==='client'?(keys[keybinds.p1.boost]||isMobileBoosting):keys[keybinds.p2.boost])&&p2Charge>0;
                const p2TierB=(1+p2TransformTier*.09);
                if(p2Charging)p2Charge=Math.min(p2MaxCharge,p2Charge+50*p2TierB*dt);
                if(p2Boost){p2Charge=Math.max(0,p2Charge-14*dt);if(Math.random()<0.55)ghostTrails.push({x:player2.x,y:player2.y,r:player2.r,angle:player2.angle,life:1.0,stretch:1+Math.min(1,Math.hypot(player2.vx,player2.vy)/420)*.35,tier:p2TransformTier,isP2:true});}
            // Client-side dash prediction for online mode
            if(onlineMode==='client' && (keys[keybinds.p1.boost]||isMobileBoosting) && p2Charge>0){
                clientPredicted.boosting=true;clientPredicted.boostTimer=0.3;
                if(Math.random()<0.6)clientGhostTrails.push({
                    x:player2?player2.x:0,y:player2?player2.y:0,
                    r:player2?player2.r:11,angle:player2?player2.angle:0,
                    life:1.0,stretch:1.35,tier:p2TransformTier,isP2:true
                });
            }
                updateChargeBarHUD();
                const p2ShootKey=onlineMode==='client'?(keys[keybinds.p1.shoot]||isMobileShooting):keys[keybinds.p2.shoot];const p2ChargeKey=onlineMode==='client'?(keys[keybinds.p1.charge]||isMobileCharging):keys[keybinds.p2.charge];if(p2ShootKey&&!p2ChargeKey&&player2.fireCooldown<=0&&p2Charge>=p2MaxCharge*0.01){
                    player2.fireCooldown=0.1/p2TierB;
                    p2Charge=Math.max(0,p2Charge-p2MaxCharge*0.01);
                    const p2sz=(3+p2TransformTier*.8)*p2TierB;
                    const p2dmg=Math.round((1+p2TransformTier*.07));
                    const p2AimAngle=isPhone?applyAimAssist(player2.x,player2.y,player2.angle,[player],340,0.26,0.22):player2.angle;
                    if(onlineMode==='client'){
                        // This whole block runs on both host and client for responsiveness, but only the
                        // HOST's copy of this bullet is authoritative (it's the one that gets network-synced
                        // to the client). If the client also pushed a real bullet into the shared `bullets`
                        // array here, the host's synced copy would arrive moments later as a second, separate
                        // bullet -> visible duplicate/multiplied shots on the joining player's screen. So the
                        // client only spawns a short-lived cosmetic prediction here; the real bullet comes in
                        // via the network a few frames later.
                        clientBullets.push({x:player2.x+Math.cos(p2AimAngle)*player2.r,y:player2.y+Math.sin(p2AimAngle)*player2.r,vx:Math.cos(p2AimAngle)*760,vy:Math.sin(p2AimAngle)*760,r:p2sz,color:P2_TIER_COLORS[p2TransformTier],life:1.3,_clientPred:true});
                    }else{
                        bullets.push({x:player2.x+Math.cos(p2AimAngle)*player2.r,y:player2.y+Math.sin(p2AimAngle)*player2.r,vx:Math.cos(p2AimAngle)*760,vy:Math.sin(p2AimAngle)*760,r:p2sz,damage:Math.max(1,p2dmg),life:1.3,color:P2_TIER_COLORS[p2TransformTier],owner:'p2',_netNew:(gameMode===2)});
                    }
                    SoundEngine.sfx('collect');
                }
                updateHP2PHUD();
                let p2spdMul=p2Boost?1.6:(p2Charging?0.4:1);
                const p2speed=PLAYER_SPEED*p2spdMul*p2TierB;
                player2.vx=player2.input.x*p2speed;player2.vy=player2.input.y*p2speed;
                player2.x+=player2.vx*dt;player2.y+=player2.vy*dt;
                player2.x=Math.max(player2.r,Math.min(WORLD_W-player2.r,player2.x));
                player2.y=Math.max(player2.r,Math.min(WORLD_H-player2.r,player2.y));
                if(player2.input.x||player2.input.y)player2.angle=Math.atan2(player2.input.y,player2.input.x);
                if(p2Boost){for(let i=0;i<2;i++)particles.push({x:player2.x-Math.cos(player2.angle)*player2.r*1.2+(Math.random()-.5)*6,y:player2.y-Math.sin(player2.angle)*player2.r*1.2+(Math.random()-.5)*6,life:.2,r:2.5,color:'#ff3b5c'});}
            }
            if(gameMode===2&&onlineMode==='host'){
                hostBroadcastTimer-=dt;
                if(hostBroadcastTimer<=0){hostBroadcastTimer=1/30;hostBroadcastState();}
            }

            if(gameMode===1){
                lastSpawn+=dt;
                if(lastSpawn>DIFFICULTIES[settings.difficulty].spawnInterval*1.2&&enemies.length<MAX_ENEMIES&&!bosses.length){lastSpawn=0;spawnEnemy();}
                powerupTimer-=dt;if(powerupTimer<=0&&powerups.length<1){spawnPowerup();powerupTimer=POWERUP_INTERVAL;}
            }

            for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];p.life-=dt;p.spin+=dt*1.2;if(p.life<=0){powerups.splice(i,1);continue;}if(Math.hypot(player.x-p.x,player.y-p.y)<p.r+player.r+2){collectPowerup(p.type);powerups.splice(i,1);}}

            for(const bp of boostPads){
                if(bp.cooldown>0){bp.cooldown-=dt;continue;}
                if(Math.hypot(player.x-bp.x,player.y-bp.y)<bp.r+player.r){buffs.speedT=Math.max(buffs.speedT,2.8);updateBuffsHUD();bp.cooldown=4.5;SoundEngine.sfx('collect');for(let i=0;i<6;i++)particles.push({x:bp.x,y:bp.y,life:.35,r:2.5,color:'#5cff7e'});}
            }
            for(let i=coinNodes.length-1;i>=0;i--){const c=coinNodes[i];c.spin+=dt*2;if(Math.hypot(player.x-c.x,player.y-c.y)<c.r+player.r){addCoins(2+Math.floor(Math.random()*3));coinNodes.splice(i,1);}}

            let slowMult=buffs.slowT>0?.4:1;if(timeFreezeTimer>0)slowMult*=.1;
            closestDist=9999;let shieldUsed=false;

            for(let idx=enemies.length-1;idx>=0;idx--){
                const en=enemies[idx];
                const dx=player.x-en.x,dy=player.y-en.y,dist=Math.hypot(dx,dy);
                closestDist=Math.min(closestDist,dist-en.size*.6-player.r);
                en.wob+=dt*1.8;const wobA=Math.sin(en.wob)*.25;const ang=Math.atan2(dy,dx)+wobA*.3;en.angle=Math.atan2(dy,dx);
                if(en.zigzag)en.angle+=Math.sin(elapsed*2.5+en.wob)*.6*dt;
                
                if(en.stalker){
                    en.stealthTimer-=dt;
                    if(en.stealthTimer<=0){
                        en.stealthTimer=2.0+Math.random()*1.5;
                        for(let k=0;k<5;k++)particles.push({x:en.x+(Math.random()-.5)*10,y:en.y+(Math.random()-.5)*10,life:.4,r:2,color:'#00ffaa'});
                    }
                    const stealthPhase=en.stealthTimer>1.2?1:en.stealthTimer>0.4?0.3:0.08;
                    const t=Math.min(elapsed/45,1);
                    en.speed=(90+t*45)*DIFFICULTIES[settings.difficulty].speedMult*1.3*(stealthPhase<0.5?2.2:1);
                }
                
                let juggernautMoved=false;
                if(en.juggernaut){
                    en.chargeTimer+=dt;
                    if(Math.random()<0.3)particles.push({x:en.x+(Math.random()-.5)*6,y:en.y+(Math.random()-.5)*6,life:.35,r:2,color:'#ff0044'});
                    if((dist<200&&en.chargeTimer>2.5)||(en.hp<en.maxHp*.5&&en.chargeTimer>1.5)){
                        en.chargeTimer=0;
                        const chargeA=Math.atan2(player.y-en.y,player.x-en.x);
                        en.vx=Math.cos(chargeA)*350;en.vy=Math.sin(chargeA)*350;
                        screenShake=6;
                        for(let k=0;k<8;k++){const a=Math.random()*Math.PI*2,s=40+Math.random()*80;shards.push({x:en.x,y:en.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*4,size:2+Math.random()*3,life:.8,color:'#ff0055'});}
                        SoundEngine.sfx('shatter');
                    }
                    if(en.vx||en.vy){
                        en.x+=en.vx*dt;en.y+=en.vy*dt;
                        en.vx*=0.92;en.vy*=0.92;
                        if(Math.abs(en.vx)<5&&Math.abs(en.vy)<5){en.vx=0;en.vy=0;}
                        en.x=Math.max(en.size,Math.min(WORLD_W-en.size,en.x));
                        en.y=Math.max(en.size,Math.min(WORLD_H-en.size,en.y));
                        juggernautMoved=true;
                    }
                }
                
                if(!juggernautMoved){
                    if(en.bomber){en.timer+=dt;if(en.timer>.1){en.timer=0;particles.push({x:en.x,y:en.y,life:.8,r:4,color:'#ff6600'});if(Math.hypot(player.x-en.x,player.y-en.y)<40){if(buffs.shieldOn){buffs.shieldOn=false;buffs.shieldT=0;updateBuffsHUD();SoundEngine.sfx('shield');}else{triggerDeath();return;}}}}
                    en.x+=Math.cos(en.angle+wobA)*en.speed*slowMult*dt;
                    en.y+=Math.sin(en.angle+wobA)*en.speed*slowMult*dt;
                    en.x=Math.max(en.size,Math.min(WORLD_W-en.size,en.x));
                    en.y=Math.max(en.size,Math.min(WORLD_H-en.size,en.y));
                }
                if(dist<en.size*.5+player.r*.65){
                    if(buffs.shieldOn||shieldUsed){
                        if(buffs.shieldOn){buffs.shieldOn=false;buffs.shieldT=0;SoundEngine.sfx('shield');updateBuffsHUD();}
                        shieldUsed=true;en.hp--;if(en.hp<=0){
                            if(en.splitter&&en.splitCount>0){en.splitCount--;for(let i=0;i<2;i++){const a=Math.atan2(player.y-en.y,player.x-en.x)+(i===0?.3:-.3);enemies.push({x:en.x,y:en.y,size:en.size*.7,speed:en.speed*1.1,angle:a,wob:Math.random()*Math.PI*2,type:en.type,hp:1,maxHp:1,splitter:false,tank:false,zigzag:false,bomber:false,color:'#4bf5ff'});}}
                            explodeEnemy(en);enemies.splice(idx,1);kills++;updateKillsHUD();
                        }else{en.x-=Math.cos(ang)*22;en.y-=Math.sin(ang)*22;}
                    }else{triggerDeath();return;}
                }
            }

            // BOSS LOGIC (abbreviated from original for brevity, but fully functional)
            for(let i=bosses.length-1;i>=0;i--){
                const b=bosses[i];if(b.flash>0)b.flash-=dt;
                const dx=player.x-b.x,dy=player.y-b.y,dist=Math.hypot(dx,dy);
                closestDist=Math.min(closestDist,dist-b.size*.5-player.r);
                b.wob+=dt*1.3;const wobA=Math.sin(b.wob)*.14;b.angle=Math.atan2(dy,dx);
                const enrage=b.hp<b.maxHp*.5;

                // Type 2: Glacial Wraith
                if(b.type===2){
                    if(b.iceShield){b.shieldRegen+=dt;if(b.shieldRegen>0.6&&b.shieldHP<b.shieldMax){b.shieldHP=Math.min(b.shieldMax,b.shieldHP+0.7);b.shieldRegen=0;}}
                    if(dist<160){b.freezeAura+=dt;if(b.freezeAura>1)b.freezeAura=1;if(Math.random()<0.3)particles.push({x:player.x+(Math.random()-.5)*30,y:player.y+(Math.random()-.5)*30,life:.2,r:2,color:'#88ddff'});}
                    b.spiralTimer-=dt;const sInterval=enrage?0.7:1.2;
                    if(b.spiralTimer<=0){b.spiralTimer=sInterval;
                        for(let k=0;k<6;k++){const a=b.spiralAngle+k*Math.PI/3;bossBullets.push({x:b.x+Math.cos(a)*b.size*.5,y:b.y+Math.sin(a)*b.size*.5,vx:Math.cos(a)*180,vy:Math.sin(a)*180,r:5,life:2.8,color:'#88ddff',ice:true});}
                        b.spiralAngle+=0.35;SoundEngine.sfx('collect');
                    }
                    b.iceSpikeTimer-=dt;if(b.iceSpikeTimer<=0){b.iceSpikeTimer=enrage?1.0:1.6;
                        const spikeCount=enrage?4:3;for(let k=0;k<spikeCount;k++){const ang=Math.random()*Math.PI*2;const rad=40+Math.random()*120;const sx=player.x+Math.cos(ang)*rad,sy=player.y+Math.sin(ang)*rad;if(Math.hypot(player.x-sx,player.y-sy)<25){if(buffs.shieldOn){buffs.shieldOn=false;buffs.shieldT=0;updateBuffsHUD();SoundEngine.sfx('shield');}else{triggerDeath();return;}}for(let j=0;j<4;j++)shards.push({x:sx+(Math.random()-.5)*10,y:sy+(Math.random()-.5)*10,vx:(Math.random()-.5)*60,vy:-80-Math.random()*60,rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*4,size:2+Math.random()*3,life:.8,color:'#88ddff'});shockwaves.push({x:sx,y:sy,r:0,maxR:35,color:'rgba(136,221,255,.3)',hostile:false});}SoundEngine.sfx('shatter');
                    }
                    b.x+=Math.cos(b.angle+wobA)*b.speed*slowMult*dt;
                    b.y+=Math.sin(b.angle+wobA)*b.speed*slowMult*dt;
                    b.x=Math.max(b.size*.5,Math.min(WORLD_W-b.size*.5,b.x));
                    b.y=Math.max(b.size*.5,Math.min(WORLD_H-b.size*.5,b.y));
                    if(dist<b.size*.45+player.r*.65){
                        if(b.iceShield&&b.shieldHP>0){b.shieldHP-=2;b.flash=.12;screenShake=7;b.x-=Math.cos(b.angle)*22;b.y-=Math.sin(b.angle)*22;SoundEngine.sfx('shield');if(b.shieldHP<=0){b.iceShield=false;b.shieldHP=0;for(let k=0;k<10;k++){const a3=Math.random()*Math.PI*2,s3=60+Math.random()*120;shards.push({x:b.x,y:b.y,vx:Math.cos(a3)*s3,vy:Math.sin(a3)*s3,rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*5,size:3+Math.random()*4,life:1.4,color:'#88ddff'});}shockwaves.push({x:b.x,y:b.y,r:0,maxR:170,color:'rgba(136,221,255,.4)',hostile:false});SoundEngine.sfx('shatter');}}else if(buffs.shieldOn||shieldUsed){if(buffs.shieldOn){buffs.shieldOn=false;buffs.shieldT=0;SoundEngine.sfx('shield');updateBuffsHUD();}shieldUsed=true;b.hp-=2;b.flash=.18;screenShake=10;b.x-=Math.cos(b.angle)*30;b.y-=Math.sin(b.angle)*30;if(b.hp<=0)killBoss(b,i);}else{triggerDeath();return;}
                    }
                    continue;
                }

                // Type 3: Inferno Colossus
                if(b.type===3){
                    b.phaseTimer+=dt;b.corePulse+=dt*2.5;
                    const enrage3=b.hp<b.maxHp*.45;
                    if(enrage3&&!b.rageTriggered){
                        b.rageTriggered=true;b.rageMode=true;
                        b.speed=72;b.shootTimer=.6;b.minionTimer=.7;
                        screenShake=22;
                        for(let k=0;k<24;k++){const a=Math.PI*2*k/24+Math.random()*.3,s=80+Math.random()*200;shards.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*6,size:3+Math.random()*6,life:2.0,color:'#ff6600'});}
                        shockwaves.push({x:b.x,y:b.y,r:0,maxR:300,color:'rgba(255,100,0,0.6)',hostile:true});
                        SoundEngine.sfx('bossAppear');
                    }
                    b.heatAura+=dt;
                    if(dist<140&&b.heatAura>0.4){
                        b.heatAura=0;
                        if(Math.random()<0.3)particles.push({x:player.x+(Math.random()-.5)*20,y:player.y+(Math.random()-.5)*20,life:.2,r:1.5,color:'#ff4400'});
                        if(dist<90){if(buffs.shieldOn){buffs.shieldOn=false;buffs.shieldT=0;updateBuffsHUD();SoundEngine.sfx('shield');}else{player.hp-=3;b.flash=.1;screenShake=3;if(player.hp<=0){triggerDeath();return;}}}
                    }
                    b.shootTimer-=dt;
                    if(b.shootTimer<=0){
                        b.shootTimer=enrage3?0.55:0.9;
                        const count=enrage3?4:3;
                        const spread=enrage3?0.18:0.12;
                        for(let j=0;j<count;j++){
                            const a=b.angle-(count-1)*spread/2+j*spread;
                            const spd=200+Math.random()*80;
                            bossBullets.push({x:b.x+Math.cos(a)*b.size*.45,y:b.y+Math.sin(a)*b.size*.45,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:5,life:3.5,color:'#ff6600',fire:true,trail:true});
                        }
                        if(enrage3){for(let j=0;j<6;j++){const a=b.angle+j*Math.PI/3;bossBullets.push({x:b.x+Math.cos(a)*b.size*.3,y:b.y+Math.sin(a)*b.size*.3,vx:Math.cos(a)*160,vy:Math.sin(a)*160,r:4,life:2.5,color:'#ffaa00',fire:true});}}
                        SoundEngine.sfx('collect');
                    }
                    b.meteorTimer-=dt;
                    if(b.meteorTimer<=0){
                        b.meteorTimer=enrage3?3.0:5.0;
                        const meteorCount=enrage3?3:2;
                        for(let m=0;m<meteorCount;m++){

        function updateShards(dt){for(let i=shards.length-1;i>=0;i--){const s=shards[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.98;s.vy*=.98;s.rot+=s.vr*dt;s.life-=dt;if(s.life<=0)shards.splice(i,1);}enforceArrayLimits();}

        function updateFriends(dt){

                f.x=Math.max(f.size,Math.min(WORLD_W-f.size,f.x));f.y=Math.max(f.size,Math.min(WORLD_H-f.size,f.y));

                for(const en of enemies){if(Math.hypot(f.x-en.x,f.y-en.y)<f.size*.45+en.size*.4){f.hp=(f.hp||2)-1;const a=Math.atan2(en.y-f.y,en.x-f.x);en.x+=Math.cos(a)*35;en.y+=Math.sin(a)*35;if(f.hp<=0){friends.splice(i,1);updatePointsHUD();break;}}}
            }

            for(const o of obstacles){if(o.hp<=0)continue;const sz=Math.min(o.w,o.h)*.6;ctx.save();ctx.translate(o.x+o.w/2,o.y+o.h/2);ctx.rotate(o.angle+Math.sin(elapsed*.35+o.pulse)*.012);ctx.shadowColor=o.flash>0?'#fff':o.color;ctx.shadowBlur=o.flash>0?10:4;ctx.beginPath();if(o.type==='diamond'){ctx.moveTo(0,-sz);ctx.lineTo(sz*.55,0);ctx.lineTo(0,sz);ctx.lineTo(-sz*.55,0);ctx.closePath();}else if(o.type==='hexagon'){for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;const px=Math.cos(a)*sz,py=Math.sin(a)*sz;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.closePath();}else{ctx.rect(-o.w/2,-o.h/2,o.w,o.h);}ctx.fillStyle=o.flash>0?'#fff':o.color;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,240,.15)';ctx.lineWidth=.8;ctx.stroke();ctx.restore();if(o.hp<o.maxHp){const bw=o.w*1.0,bh=2.5,bx=o.x+o.w/2-bw/2,by=o.y-4;ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(bx,by,bw,bh);ctx.fillStyle=o.hp/o.maxHp>.5?'#4bf5ff':'#ff3b5c';ctx.fillRect(bx,by,bw*(o.hp/o.maxHp),bh);}if(o.flash>0)o.flash-=.035;}

            for(const g of ghostTrails){const ease=g.life*g.life;ctx.save();ctx.globalAlpha=ease*0.4;ctx.translate(g.x,g.y);ctx.rotate(g.angle);ctx.scale(g.stretch||1,1);const c=g.isP2?(P2_TIER_COLORS[g.tier]||'#ff3b5c'):(TIER_COLORS[g.tier]||'#4bf5ff');ctx.shadowColor=c;ctx.shadowBlur=6*ease;ctx.fillStyle=c;const r=g.r;ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(-r*.65,r*.75);ctx.lineTo(-r*.65,-r*.75);ctx.closePath();ctx.fill();ctx.restore();}

        function drawBossLight(b){

            if(b.type===4){fill=flash?'#fff':'#8b00ff';glow=flash?'#fff':'rgba(139,0,255,.7)';}
            else if(b.type===3){fill=flash?'#fff':'#ff4400';glow=flash?'#fff':'rgba(255,68,0,.7)';}
            else if(b.type===2){fill=flash?'#fff':'#88ddff';glow=flash?'#fff':'rgba(136,221,255,.7)';}

            ctx.save();ctx.translate(b.x,b.y);

            btns.forEach(btn=>{
                const startDrag=(e,clientX,clientY)=>{
                    e.preventDefault();
                    e.stopPropagation();
                    const bRect=btn.getBoundingClientRect();
                    dragTarget=btn;
                    dragOffsetX=clientX-(bRect.left+bRect.width/2);
                    dragOffsetY=clientY-(bRect.top+bRect.height/2);
                    btn.classList.add('dragging');
                    btn.style.cursor='grabbing';
                };
                btn.addEventListener('mousedown',(e)=>startDrag(e,e.clientX,e.clientY));
                btn.addEventListener('touchstart',(e)=>{
                    const t=e.changedTouches[0];
                    startDrag(e,t.clientX,t.clientY);
                },{passive:false});
            });

            const doDrag=(clientX,clientY)=>{
                if(!dragTarget)return;
                const Ww=window.innerWidth,Wh=window.innerHeight;
                let x=(clientX-dragOffsetX)/Ww;
                let y=(clientY-dragOffsetY)/Wh;
                x=Math.max(0.02,Math.min(0.98,x));
                y=Math.max(0.02,Math.min(0.98,y));
                const action=dragTarget.dataset.action;
                btnLayout[action]={x,y};
                dragTarget.style.left=(x*100)+'%';
                dragTarget.style.top=(y*100)+'%';
            };

            const onDragMove=(e)=>{doDrag(e.clientX,e.clientY);};
            const onDragTouch=(e)=>{
                e.preventDefault();
                const t=e.changedTouches[0];
                doDrag(t.clientX,t.clientY);
            };
            const endDrag=()=>{
                if(dragTarget){
                    dragTarget.classList.remove('dragging');
                    dragTarget.style.cursor='grab';
                    dragTarget=null;
                }
            };

            document.addEventListener('mousemove',onDragMove);
            document.addEventListener('touchmove',onDragTouch,{passive:false});
            document.addEventListener('mouseup',endDrag);
            document.addEventListener('touchend',endDrag);

            document.getElementById('resetLayoutBtn').addEventListener('click',()=>{
                for(const a of actionList)btnLayout[a]={...DEFAULT_BTN_LAYOUT[a]};
                saveLayout();
                applyLayout();
                document.removeEventListener('mousemove',onDragMove);
                document.removeEventListener('touchmove',onDragTouch);
                document.removeEventListener('mouseup',endDrag);
                document.removeEventListener('touchend',endDrag);
                renderLayoutEditor(actionsOverride,onDoneOverride);
            });

            document.getElementById('layoutDoneBtn').addEventListener('click',()=>{
                saveLayout();
                applyLayout();
                document.removeEventListener('mousemove',onDragMove);
                document.removeEventListener('touchmove',onDragTouch);
                document.removeEventListener('mouseup',endDrag);
                document.removeEventListener('touchend',endDrag);
                overlay.classList.add('hidden');
                goBack();
            });
            document.getElementById('layoutCancelBtn').addEventListener('click',()=>{
                document.removeEventListener('mousemove',onDragMove);
                document.removeEventListener('touchmove',onDragTouch);
                document.removeEventListener('mouseup',endDrag);
                document.removeEventListener('touchend',endDrag);
                overlay.classList.add('hidden');
                goBack();
            });
        }

                    pCtx.globalCompositeOperation='source-over';
                    const g=pCtx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,'rgba(255,255,255,.7)');g.addColorStop(.35,`hsla(${hue},90%,70%,.9)`);g.addColorStop(.7,`hsla(${(hue+120)%360},90%,60%,.5)`);g.addColorStop(1,'rgba(255,255,255,.05)');
                    pCtx.fillStyle=g;pCtx.beginPath();pCtx.moveTo(r,0);pCtx.lineTo(-r*.65,r*.75);pCtx.lineTo(-r*.65,-r*.75);pCtx.closePath();pCtx.fill();
                }else if(playerSkin==='ember_phoenix'){
                    const hue=20+30*Math.sin(tNow*0.5);
                    pCtx.globalCompositeOperation='lighter';
                    for(let i=0;i<6;i++){const a=tNow*1.2+i*1.047;const d=r*(0.6+0.25*Math.sin(tNow*1.5+i));const px=Math.cos(a)*d,py=Math.sin(a)*d;const c=`hsla(${hue+i*15},100%,60%,${0.25+0.2*Math.sin(tNow*2+i)})`;pCtx.fillStyle=c;pCtx.shadowColor=c;pCtx.shadowBlur=8;pCtx.beginPath();pCtx.arc(px,py,2+Math.sin(tNow+i)*1.5,0,Math.PI*2);pCtx.fill();}
                    pCtx.globalCompositeOperation='source-over';
                    pCtx.fillStyle=color;pCtx.shadowColor=color;pCtx.shadowBlur=16;
                    pCtx.beginPath();pCtx.moveTo(r,0);pCtx.lineTo(-r*.5,r*.85);pCtx.lineTo(-r*.7,r*.3);pCtx.lineTo(-r*.3,0);pCtx.lineTo(-r*.7,-r*.3);pCtx.lineTo(-r*.5,-r*.85);pCtx.closePath();pCtx.fill();
                    pCtx.fillStyle='#ffcc44';pCtx.shadowColor='#ff8800';pCtx.shadowBlur=14;
                    pCtx.beginPath();pCtx.arc(r*.05,0,r*.2,0,Math.PI*2);pCtx.fill();
                    for(let i=0;i<2;i++){const flip=i===0?1:-1;pCtx.save();pCtx.translate(r*.1,flip*r*0.5);pCtx.rotate(flip*0.3+Math.sin(tNow*2+i)*0.05);pCtx.fillStyle='#ff6600';pCtx.shadowColor='#ff4400';pCtx.shadowBlur=10;pCtx.beginPath();pCtx.moveTo(0,0);pCtx.lineTo(-r*.4,flip*r*.15);pCtx.lineTo(-r*.3,0);pCtx.lineTo(-r*.4,-flip*r*.15);pCtx.closePath();pCtx.fill();pCtx.restore();}
                }else if(playerSkin==='void_core'){
                    const vColor=color||'#8b00ff';
                    const p=.7+.3*Math.sin(tNow*2.2);
                    pCtx.save();pCtx.rotate(tNow*1.4);pCtx.strokeStyle=vColor;pCtx.shadowColor=vColor;pCtx.shadowBlur=14*p;pCtx.lineWidth=1.6;pCtx.globalAlpha=.6;
                    pCtx.beginPath();pCtx.ellipse(0,0,r*1.5,r*.55,0,0,Math.PI*2);pCtx.stroke();pCtx.globalAlpha=1;pCtx.restore();
                    pCtx.shadowColor=vColor;pCtx.shadowBlur=22*p;pCtx.fillStyle='#0a0014';pCtx.beginPath();pCtx.moveTo(r,0);pCtx.lineTo(-r*.65,r*.75);pCtx.lineTo(-r*.65,-r*.75);pCtx.closePath();pCtx.fill();
                    pCtx.shadowColor=vColor;pCtx.shadowBlur=16*p;pCtx.fillStyle=vColor;pCtx.beginPath();pCtx.arc(r*.05,0,r*.22,0,Math.PI*2);pCtx.fill();
                    pCtx.shadowColor='#fff';pCtx.shadowBlur=8;pCtx.fillStyle='#fff';pCtx.beginPath();pCtx.arc(r*.05,0,r*.09,0,Math.PI*2);pCtx.fill();
                }
                pCtx.restore();
                pCtx.font="bold 10px 'Orbitron',sans-serif";pCtx.textAlign='center';
                pCtx.fillStyle='rgba(233,233,244,0.6)';pCtx.shadowColor='rgba(75,245,255,0.2)';pCtx.shadowBlur=4;
                pCtx.fillText(skinNames[playerSkin]||'DEFAULT',cx,Hp-10);
                pCtx.shadowBlur=0;
                previewReq=requestAnimationFrame(drawPreviewShip);
            }
            drawPreviewShip();

            document.getElementById('backBtn').addEventListener('click',()=>{cancelAnimationFrame(previewReq);renderMainMenu();});
        }

        function startGame(mode){
            if(onlineMode)destroyOnlineConnection();
            restoreFullActionButtons();
            AudioCore.beginOnGesture();
            const transition=document.getElementById('gameTransition');
            const transBar=document.getElementById('transitionBar');
            const transContent=document.getElementById('transitionContent');

            // Show transition overlay
            if(transition){
                transition.style.display='flex';
                transition.classList.add('active');
                if(transBar)transBar.style.width='30%';
            }

            // Phase 1: Show "INITIALIZING" with progress
            setTimeout(()=>{
                if(transBar)transBar.style.width='70%';
            },200);

            // Phase 2: Complete and start game
            setTimeout(()=>{
                if(transBar)transBar.style.width='100%';

                setTimeout(()=>{
                    // Start the actual game
                    overlay.classList.add('hidden');
                    applyAttributes();
                    resetGame(mode);
                    running=true;paused=false;pauseBtn.classList.add('show');updateBuffsHUD();updateLevelHUD();
                    MusicEngine.play('menu');

                    // Exit transition
                    if(transition){
                        transition.classList.remove('active');
                        transition.classList.add('exit');
                        setTimeout(()=>{
                            transition.classList.remove('exit');
                            transition.style.display='none';
                            if(transBar)transBar.style.width='0%';
                        },600);
                    }

                    if(platform==='phone'&&!document.fullscreenElement&&!document.webkitFullscreenElement){
                        requestFullscreen();
                    }
                },250);
            },500);
        }

        function playIntroAnimation(){
            overlay.classList.add('hidden');
            const word='ECLIPSE';
            let letters='';
            for(let i=0;i<word.length;i++){letters+=`<span style="animation-delay:${.15+i*.06}s">${word[i]}</span>`;}
            introScreen.innerHTML=`
                <div class="intro-flare"></div>
                <div class="intro-ring"></div><div class="intro-ring"></div><div class="intro-ring"></div>
                <h1 class="intro-title">${letters}</h1>
            `;
            setTimeout(()=>{introScreen.classList.add('fadeOut');setTimeout(()=>{
                renderPlatformSelection();
            },700);},2600);
        }

        let lastT=0,frameDt=0.016;
        function loop(ts){
            if(!lastT)lastT=ts;
            const rawDt=(ts-lastT)/1000;
            const dt=Math.min(rawDt,.05);
            lastT=ts;
            frameDt=dt;
            if(running&&!paused){
                if(onlineMode==='client'){
                    keyboardInput();
                    clientNetworkTick(dt);
                    netInterpolateStep(dt);
                }else{
                    update(dt);
                }
            }
            render();
            requestAnimationFrame(loop);
        }

        playIntroAnimation();
        requestAnimationFrame(loop);
    })();
</script>
</body>
